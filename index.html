<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gemini Clone | Universal AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }

        /* Smooth Sidebar Transition */
        #sidebar { transition: transform 0.3s ease-in-out; }
        
        /* Message Markdown Styles */
        .prose pre { background: #1e293b; color: #f8fafc; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; margin: 0.5rem 0; }
        .prose code { font-family: monospace; background: rgba(0,0,0,0.1); padding: 0.2rem 0.4rem; border-radius: 4px; }
        .dark .prose code { background: rgba(255,255,255,0.1); }
        
        /* Mobile Layout Fixes */
        .app-container { height: 100svh; display: flex; flex-direction: column; }
        #chat-window { flex: 1; overflow-y: auto; }
        
        /* Loading Overlay */
        #loading-overlay {
            position: fixed; inset: 0; background: white; z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .dark #loading-overlay { background: #0f172a; color: white; }
    </style>
</head>
<body class="bg-gray-50 dark:bg-slate-900 text-slate-900 dark:text-slate-100 transition-colors duration-200">

    <div id="loading-overlay">
        <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-blue-500 mb-4"></div>
        <p class="font-medium">Initializing AI Interface...</p>
    </div>

    <div class="app-container overflow-hidden">
        <header class="h-14 border-b dark:border-slate-700 flex items-center justify-between px-4 bg-white dark:bg-slate-800 z-10">
            <div class="flex items-center gap-3">
                <button id="mobile-menu-btn" class="p-2 lg:hidden hover:bg-gray-100 dark:hover:bg-slate-700 rounded-lg">
                    <i class="fas fa-bars"></i>
                </button>
                <h1 class="font-bold text-lg flex items-center gap-2">
                    <span class="text-blue-600 dark:text-blue-400"><i class="fas fa-brain"></i></span>
                    <span class="hidden sm:inline">Gemini Nano</span>
                </h1>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="ui.toggleDarkMode()" class="p-2 hover:bg-gray-100 dark:hover:bg-slate-700 rounded-lg">
                    <i id="dark-mode-icon" class="fas fa-moon"></i>
                </button>
                <button onclick="ui.openSettings()" class="p-2 hover:bg-gray-100 dark:hover:bg-slate-700 rounded-lg">
                    <i class="fas fa-cog"></i>
                </button>
            </div>
        </header>

        <div class="flex flex-1 overflow-hidden relative">
            <aside id="sidebar" class="fixed inset-y-0 left-0 transform -translate-x-full lg:translate-x-0 lg:static w-72 bg-gray-50 dark:bg-slate-900 border-r dark:border-slate-700 z-30 flex flex-col pt-14 lg:pt-0">
                <div class="p-4">
                    <button onclick="chat.createNewChat()" class="w-full flex items-center gap-2 px-4 py-3 bg-blue-50 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400 rounded-full font-medium hover:bg-blue-100 dark:hover:bg-blue-900/50 transition-all">
                        <i class="fas fa-plus"></i> New Chat
                    </button>
                </div>
                <div id="history-list" class="flex-1 overflow-y-auto px-2 space-y-1">
                    </div>
            </aside>

            <div id="sidebar-overlay" class="fixed inset-0 bg-black/50 z-20 hidden lg:hidden"></div>

            <main class="flex-1 flex flex-col bg-white dark:bg-slate-800 relative">
                <div id="chat-window" class="p-4 sm:p-6 lg:px-24 space-y-6">
                    <div id="empty-state" class="h-full flex flex-col items-center justify-center text-center space-y-4 opacity-50 py-20">
                        <i class="fas fa-comment-dots text-6xl"></i>
                        <h2 class="text-2xl font-semibold">How can I help you today?</h2>
                    </div>
                </div>

                <div class="p-4 lg:px-24 border-t dark:border-slate-700 bg-white dark:bg-slate-800">
                    <form id="chat-form" class="max-w-4xl mx-auto relative">
                        <textarea id="user-input" rows="1" placeholder="Type a message..." class="w-full p-4 pr-12 rounded-2xl border dark:border-slate-600 bg-gray-50 dark:bg-slate-700 focus:ring-2 focus:ring-blue-500 outline-none resize-none transition-all" required></textarea>
                        <button type="submit" class="absolute right-3 bottom-3 p-2 bg-blue-600 text-white rounded-xl hover:bg-blue-700 transition-colors disabled:opacity-50" id="send-btn">
                            <i class="fas fa-paper-plane"></i>
                        </button>
                    </form>
                    <p class="text-center text-[10px] mt-2 text-gray-400">AI can make mistakes. Check important info.</p>
                </div>
            </main>
        </div>
    </div>

    <div id="settings-modal" class="fixed inset-0 z-50 flex items-center justify-center hidden p-4">
        <div class="fixed inset-0 bg-black/60 backdrop-blur-sm" onclick="ui.closeSettings()"></div>
        <div class="bg-white dark:bg-slate-800 rounded-2xl w-full max-w-md p-6 relative z-10 shadow-2xl">
            <h3 class="text-xl font-bold mb-4">Settings</h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1">OpenRouter API Key</label>
                    <input type="password" id="api-key-input" class="w-full p-2 rounded border dark:bg-slate-700 dark:border-slate-600" placeholder="sk-or-...">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Model Name</label>
                    <input type="text" id="model-input" class="w-full p-2 rounded border dark:bg-slate-700 dark:border-slate-600" placeholder="deepseek/deepseek-r1:free">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">System Prompt</label>
                    <textarea id="system-prompt-input" rows="3" class="w-full p-2 rounded border dark:bg-slate-700 dark:border-slate-600" placeholder="You are a helpful assistant..."></textarea>
                </div>
                <button onclick="ui.saveSettings()" class="w-full bg-blue-600 text-white py-2 rounded-lg font-bold hover:bg-blue-700">Save Changes</button>
            </div>
        </div>
    </div>

    <script>
        /**
         * GLOBAL STATE & CONFIG
         */
        const state = {
            chats: JSON.parse(localStorage.getItem('chats')) || [],
            activeChatId: null,
            settings: JSON.parse(localStorage.getItem('settings')) || {
                apiKey: '',
                model: 'deepseek/deepseek-r1:free',
                systemPrompt: 'You are a helpful AI assistant.',
                darkMode: false
            }
        };

        /**
         * CHAT LOGIC
         */
        const chat = {
            createNewChat() {
                const newChat = {
                    id: Date.now().toString(),
                    title: 'New Conversation',
                    messages: [],
                    timestamp: new Date().toISOString()
                };
                state.chats.unshift(newChat);
                state.activeChatId = newChat.id;
                this.save();
                ui.renderHistory();
                ui.renderMessages();
                if (window.innerWidth < 1024) ui.toggleSidebar(false);
            },

            async sendMessage(content) {
                if (!state.settings.apiKey) {
                    alert('Please enter your OpenRouter API Key in settings first!');
                    ui.openSettings();
                    return;
                }

                const currentChat = state.chats.find(c => c.id === state.activeChatId);
                if (!currentChat) return;

                // Add User Message
                currentChat.messages.push({ role: 'user', content });
                if (currentChat.messages.length === 1) currentChat.title = content.substring(0, 30) + '...';
                
                ui.renderMessages();
                const aiMessageObj = { role: 'assistant', content: '' };
                currentChat.messages.push(aiMessageObj);
                const aiMsgIndex = currentChat.messages.length - 1;

                try {
                    const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                        method: "POST",
                        headers: {
                            "Authorization": `Bearer ${state.settings.apiKey}`,
                            "Content-Type": "application/json",
                            "HTTP-Referer": window.location.href,
                            "X-Title": "Gemini Clone"
                        },
                        body: JSON.stringify({
                            model: state.settings.model,
                            messages: [
                                { role: 'system', content: state.settings.systemPrompt },
                                ...currentChat.messages.slice(0, -1)
                            ],
                            stream: true
                        })
                    });

                    const reader = response.body.getReader();
                    const decoder = new TextDecoder();
                    
                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;

                        const chunk = decoder.decode(value);
                        const lines = chunk.split('\n').filter(line => line.trim() !== '');
                        
                        for (const line of lines) {
                            if (line.includes('[DONE]')) continue;
                            try {
                                const json = JSON.parse(line.replace('data: ', ''));
                                const token = json.choices[0]?.delta?.content || '';
                                currentChat.messages[aiMsgIndex].content += token;
                                ui.updateStreamingMessage(currentChat.messages[aiMsgIndex].content);
                            } catch (e) { /* partial chunk */ }
                        }
                    }
                } catch (error) {
                    currentChat.messages[aiMsgIndex].content = "⚠️ Error: " + error.message;
                    ui.renderMessages();
                }

                this.save();
                ui.renderHistory();
            },

            deleteChat(id, e) {
                e.stopPropagation();
                state.chats = state.chats.filter(c => c.id !== id);
                if (state.activeChatId === id) state.activeChatId = null;
                this.save();
                ui.renderHistory();
                ui.renderMessages();
            },

            save() {
                localStorage.setItem('chats', JSON.stringify(state.chats));
            }
        };

        /**
         * UI CONTROLLER
         */
        const ui = {
            init() {
                // Apply Dark Mode
                if (state.settings.darkMode) document.documentElement.classList.add('dark');
                this.updateDarkModeIcon();

                // Set Settings values
                document.getElementById('api-key-input').value = state.settings.apiKey;
                document.getElementById('model-input').value = state.settings.model;
                document.getElementById('system-prompt-input').value = state.settings.systemPrompt;

                this.renderHistory();
                
                // Hide Loader
                setTimeout(() => {
                    document.getElementById('loading-overlay').style.display = 'none';
                }, 500);

                // Auto-resize textarea
                const uta = document.getElementById('user-input');
                uta.addEventListener('input', () => {
                    uta.style.height = 'auto';
                    uta.style.height = (uta.scrollHeight) + 'px';
                });
            },

            renderHistory() {
                const container = document.getElementById('history-list');
                container.innerHTML = state.chats.map(c => `
                    <div onclick="ui.selectChat('${c.id}')" class="group flex items-center justify-between p-3 rounded-xl cursor-pointer transition-colors ${state.activeChatId === c.id ? 'bg-gray-200 dark:bg-slate-800' : 'hover:bg-gray-100 dark:hover:bg-slate-800/50'}">
                        <div class="flex items-center gap-3 overflow-hidden">
                            <i class="far fa-comment text-gray-400"></i>
                            <span class="truncate text-sm">${c.title}</span>
                        </div>
                        <button onclick="chat.deleteChat('${c.id}', event)" class="opacity-0 group-hover:opacity-100 p-1 hover:text-red-500 transition-opacity">
                            <i class="fas fa-trash-alt text-xs"></i>
                        </button>
                    </div>
                `).join('');
            },

            selectChat(id) {
                state.activeChatId = id;
                this.renderMessages();
                this.renderHistory();
                if (window.innerWidth < 1024) this.toggleSidebar(false);
            },

            renderMessages() {
                const container = document.getElementById('chat-window');
                const empty = document.getElementById('empty-state');
                const currentChat = state.chats.find(c => c.id === state.activeChatId);

                if (!currentChat || currentChat.messages.length === 0) {
                    container.innerHTML = '';
                    container.appendChild(empty);
                    return;
                }

                empty.remove();
                container.innerHTML = currentChat.messages.map((m, idx) => `
                    <div class="flex ${m.role === 'user' ? 'justify-end' : 'justify-start'} animate-in fade-in slide-in-from-bottom-2 duration-300">
                        <div class="max-w-[85%] sm:max-w-[70%] p-4 rounded-2xl ${
                            m.role === 'user' 
                            ? 'bg-blue-600 text-white rounded-tr-none' 
                            : 'bg-gray-100 dark:bg-slate-700 text-slate-800 dark:text-slate-100 rounded-tl-none'
                        }">
                            <div class="prose dark:prose-invert max-w-none text-sm leading-relaxed">
                                ${marked.parse(m.content)}
                            </div>
                        </div>
                    </div>
                `).join('');
                
                container.scrollTop = container.scrollHeight;
            },

            updateStreamingMessage(content) {
                const container = document.getElementById('chat-window');
                const lastMsg = container.lastElementChild?.querySelector('.prose');
                if (lastMsg) {
                    lastMsg.innerHTML = marked.parse(content);
                    container.scrollTop = container.scrollHeight;
                }
            },

            toggleSidebar(force) {
                const sb = document.getElementById('sidebar');
                const overlay = document.getElementById('sidebar-overlay');
                const isOpen = force !== undefined ? force : sb.classList.contains('-translate-x-full');
                
                if (isOpen) {
                    sb.classList.remove('-translate-x-full');
                    overlay.classList.remove('hidden');
                } else {
                    sb.classList.add('-translate-x-full');
                    overlay.classList.add('hidden');
                }
            },

            openSettings() { document.getElementById('settings-modal').classList.remove('hidden'); },
            closeSettings() { document.getElementById('settings-modal').classList.add('hidden'); },
            
            saveSettings() {
                state.settings.apiKey = document.getElementById('api-key-input').value;
                state.settings.model = document.getElementById('model-input').value || 'deepseek/deepseek-r1:free';
                state.settings.systemPrompt = document.getElementById('system-prompt-input').value;
                localStorage.setItem('settings', JSON.stringify(state.settings));
                this.closeSettings();
            },

            toggleDarkMode() {
                state.settings.darkMode = !state.settings.darkMode;
                document.documentElement.classList.toggle('dark');
                localStorage.setItem('settings', JSON.stringify(state.settings));
                this.updateDarkModeIcon();
            },

            updateDarkModeIcon() {
                const icon = document.getElementById('dark-mode-icon');
                icon.className = state.settings.darkMode ? 'fas fa-sun' : 'fas fa-moon';
            }
        };

        /**
         * EVENT LISTENERS
         */
        document.getElementById('chat-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const input = document.getElementById('user-input');
            const content = input.value.trim();
            
            if (!content) return;
            
            if (!state.activeChatId) chat.createNewChat();
            
            input.value = '';
            input.style.height = 'auto';
            chat.sendMessage(content);
        });

        document.getElementById('mobile-menu-btn').addEventListener('click', () => ui.toggleSidebar());
        document.getElementById('sidebar-overlay').addEventListener('click', () => ui.toggleSidebar(false));

        // Keyboard Shortcut: Enter to send, Shift+Enter for newline
        document.getElementById('user-input').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey && window.innerWidth > 768) {
                e.preventDefault();
                document.getElementById('chat-form').requestSubmit();
            }
        });

        // Start the app
        ui.init();
    </script>
</body>
      </html>
